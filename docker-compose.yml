name: mansam-rag

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Local cross-encoder used as the retrieval precision stage, so ranking does not
  # depend on a hosted reranking API. Point RERANK_INFERENCE_URL at
  # http://localhost:8082/rerank. Host port 8082 (not 8081) because 8081 is commonly
  # taken by other local tooling, and a port shadowed on the host makes the reranker
  # silently unreachable. `gpus: all` is required because the image ships a CUDA
  # build: without it the router exits with "libcuda.so.1: cannot open shared object".
  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:1.8
    command: ["--model-id", "BAAI/bge-reranker-v2-m3"]
    gpus: all
    ports:
      - "8082:80"
    volumes:
      - reranker_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 600s

  # Local speech server for the microphone and the playback controls. It serves the
  # OpenAI routes POST /v1/audio/transcriptions (faster-whisper) and POST /v1/audio/speech
  # (Kokoro), so STT_PROVIDER=openai / TTS_PROVIDER=openai need no hosted speech token.
  # The CPU image is deliberate: the 6 GB GPU is already shared by Ollama and the
  # reranker, and a small Whisper model transcribes a question in about a second on CPU.
  # Point STT_INFERENCE_URL at http://localhost:8083/v1/audio/transcriptions and
  # TTS_INFERENCE_URL at http://localhost:8083/v1/audio/speech.
  speech:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    ports:
      - "8083:8000"
    volumes:
      - speech_models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./prompts:/app/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    env_file: .env
    volumes:
      - ./uploads:/app/uploads
      - ./prompts:/app/prompts:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  reranker_data:
  speech_models:

